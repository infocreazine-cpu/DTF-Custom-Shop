name: Attach tactile controls V48

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  attach-touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Attach tactile assets to index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="/touch-v48.css?v=48">'
          js='<script src="/touch-v48.js?v=48"></script>'
          changed=False
          if css not in s:
              if '</head>' not in s: raise SystemExit('Missing </head>')
              s=s.replace('</head>',css+'\n</head>',1); changed=True
          if js not in s:
              if '</body>' not in s: raise SystemExit('Missing </body>')
              s=s.replace('</body>',js+'\n</body>',1); changed=True
          if changed: p.write_text(s,encoding='utf-8')
          PY
      - name: Commit if needed
        run: |
          if git diff --quiet -- index.html; then
            echo "Already attached"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable tactile move pinch and rotation"
          git push origin main
