name: Make product cards clickable

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make full product cards clickable
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css_marker = '/* FULL_CARD_BUTTON_V46 */'
          js_marker = '// FULL_CARD_BUTTON_V46'

          if css_marker not in s:
              css = '''\n/* FULL_CARD_BUTTON_V46 */\n.product-card{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}\n.product-card:active{transform:scale(.99)}\n.product-card:focus-visible{outline:4px solid #0877d5;outline-offset:2px}\n.personalize{display:none!important}\n'''
              if '</style>' not in s:
                  raise SystemExit('Missing </style> in index.html')
              s = s.replace('</style>', css + '\n</style>', 1)

          if js_marker not in s:
              js = '''\n<script>\n// FULL_CARD_BUTTON_V46\ndocument.querySelectorAll('.product-card').forEach(card => {\n  card.setAttribute('role', 'button');\n  card.setAttribute('tabindex', '0');\n  const activateCard = () => {\n    const btn = card.querySelector('.personalize');\n    if (btn) btn.click();\n  };\n  card.addEventListener('click', (event) => {\n    if (event.target.closest('.personalize')) return;\n    activateCard();\n  });\n  card.addEventListener('keydown', (event) => {\n    if (event.key === 'Enter' || event.key === ' ') {\n      event.preventDefault();\n      activateCard();\n    }\n  });\n});\n</script>\n'''
              if '</body>' not in s:
                  raise SystemExit('Missing </body> in index.html')
              s = s.replace('</body>', js + '\n</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch if needed
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make product cards fully clickable"
          git push origin main
