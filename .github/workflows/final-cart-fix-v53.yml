name: Final V53 cart repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair kiosk scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('order-v47.js')
          s=p.read_text(encoding='utf-8')
          old="body.querySelector('#v47-add').onclick=()=>{cart.push({id:Date.now(),product:state.product,label:state.label,size:state.size,color:state.color,zone:state.zone,zoneLabel:currentZone()[1],limit:currentZone()[2],qty:state.qty,art:state.art,scale:state.scale,rotate:state.rotate,x:state.x,y:state.y});saveCart();openCart();};"
          new="const addToCart=()=>{ if(textile() && state.zone==='center') state.zone='heart'; const z=currentZone(); cart.push({id:Date.now(),product:state.product,label:state.label,size:state.size,color:state.color,zone:state.zone,zoneLabel:z[1],limit:z[2],qty:state.qty,art:state.art,scale:state.scale,rotate:state.rotate,x:state.x,y:state.y}); saveCart(); openCart(); }; const addBtn=body.querySelector('#v47-add'); addBtn.onclick=addToCart; addBtn.addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();addToCart();},{once:true});"
          if old in s:
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          # remove all kiosk module script tags then add exactly one clean set
          import re
          h=re.sub(r'\n?<script src="/order-v47\.js\?v=\d+"></script>','',h)
          h=re.sub(r'\n?<script src="/touch-v48\.js\?v=\d+"></script>','',h)
          h=re.sub(r'\n?<script src="/order-v49\.js\?v=\d+"></script>','',h)
          clean='\n<script src="/order-v47.js?v=53"></script>\n<script src="/touch-v48.js?v=53"></script>\n<script src="/order-v49.js?v=53"></script>\n'
          h=h.replace('</body>',clean+'</body>',1)
          idx.write_text(h,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add order-v47.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Repair add-to-cart and deduplicate kiosk scripts V53"
          git push origin main
