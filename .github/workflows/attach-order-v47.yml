name: Attach V47 order flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Attach V47 assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'order-v47.css' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="/order-v47.css?v=47">\n</head>',1)
          if 'order-v47.js' not in s:
              s=s.replace('</body>','<script src="/order-v47.js?v=47"></script>\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable V47 order and customization flow"
          git push origin main
