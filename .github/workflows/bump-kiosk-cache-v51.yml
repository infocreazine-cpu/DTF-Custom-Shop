name: Refresh kiosk script cache V51

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump-cache:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump kiosk script versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('/order-v47.js?v=47','/order-v47.js?v=51')
          s=s.replace('/order-v47.js?v=50','/order-v47.js?v=51')
          s=s.replace('/order-v49.js?v=49','/order-v49.js?v=51')
          s=s.replace('/order-v49.js?v=50','/order-v49.js?v=51')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cache bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Force reload kiosk scripts V51"
          git push origin main
