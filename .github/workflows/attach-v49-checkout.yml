name: Attach V49 checkout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Attach V49 checkout script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/order-v49.js?v=49"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('Missing </body>')
              s=s.replace('</body>', tag+'\n</body>', 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Attach V49 checkout module"
          git push origin main
